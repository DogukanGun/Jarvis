# Master Docker Compose for entire Jarvis Group Communication Layer
# Run from this directory: docker-compose up

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - jarvis-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network

  # Ollama LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - jarvis-network

  # ============================================================================
  # AGENT SERVICES
  # ============================================================================

  # Router Service (Go)
  router:
    build:
      context: ./agent/router
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      ROUTER_PORT: 8888
      ENABLE_GROUP_LAYER: "true"
      GROUP_ID: jarvis-main
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: jarvis
      MINIO_USE_SSL: "false"
      ROUTER_LLM_PROVIDER: openai
      ROUTER_LLM_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_ID: orchestrator
      SWISS_KNIFE_BASE_URL: http://swiss-army-knife:8787
      THINKER_BASE_URL: http://thinker:8585
      MEMORY_BASE_URL: http://memory-worker:8686
      WEB_FETCHER_BASE_URL: http://web-fetcher:8000
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network

  # Web Fetcher (Python)
  web-fetcher:
    build:
      context: ./agent/web_fetcher
      dockerfile: Dockerfile
    ports:
      - "8083:8000"
    environment:
      ENABLE_GROUP_LAYER: "true"
      GROUP_ID: jarvis-main
      AGENT_ID: web-fetcher
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - jarvis-network

  # Kafka Consumer for Web Fetcher
  web-fetcher-kafka-consumer:
    build:
      context: ./agent/web_fetcher
      dockerfile: Dockerfile
    environment:
      GROUP_ID: jarvis-main
      AGENT_ID: web-fetcher
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    command: python kafka_consumer.py
    networks:
      - jarvis-network

  # ============================================================================
  # SWISS ARMY KNIFE - Security/Network Tool Agent
  # ============================================================================

  # Swiss Army Knife HTTP Server
  swiss-army-knife:
    build:
      context: ./agent/swiss-army-knife
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      KAFKA_BROKERS: kafka:9092
      GROUP_ID: jarvis-main
      AGENT_ID: swiss-army-knife
      ENABLE_GROUP_LAYER: "true"
      CONFIRMATION_TIMEOUT: 300
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis-network

  # Swiss Army Knife Kafka Consumer
  swiss-army-knife-kafka-consumer:
    build:
      context: ./agent/swiss-army-knife
      dockerfile: Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      GROUP_ID: jarvis-main
      AGENT_ID: swiss-army-knife
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ENABLE_GROUP_LAYER: "true"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      kafka:
        condition: service_healthy
    command: python run_kafka_consumer.py
    networks:
      - jarvis-network

  # ============================================================================
  # THINKER & MEMORY BACKENDS
  # ============================================================================

  # Thinker Service (Python)
  thinker:
    build:
      context: ./agent/thinker
      dockerfile: Dockerfile
    ports:
      - "8585:8585"
    environment:
      KAFKA_BROKERS: kafka:9092
      GROUP_ID: jarvis-main
      AGENT_ID: thinker
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - jarvis-network

  # Memory (Episodic) Service (Python)
  memory-worker:
    build:
      context: ./agent/memory/episodic
      dockerfile: Dockerfile
    ports:
      - "8686:8686"
    environment:
      KAFKA_BROKERS: kafka:9092
      GROUP_ID: jarvis-main
      AGENT_ID: memory-worker
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - jarvis-network

  # ============================================================================
  # WEB UIs
  # ============================================================================

  # Thinker Monitor UI (Next.js)
  thinker-monitor:
    build:
      context: ./agent/thinker/monitor
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    depends_on:
      - thinker
    networks:
      - jarvis-network

  # Memory Monitor UI (Next.js)
  memory-monitor:
    build:
      context: ./agent/memory/monitor
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - memory-worker
    networks:
      - jarvis-network

  # Swiss Army Knife Monitor UI (Next.js)
  swiss-army-knife-monitor:
    build:
      context: ./agent/swiss-army-knife/monitor
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - swiss-army-knife
    networks:
      - jarvis-network

  # Router Chat UI (Next.js)
  router-ui:
    build:
      context: ./agent/router/ui
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_ROUTER_URL: http://localhost:8080
    depends_on:
      - router
    networks:
      - jarvis-network

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  minio-data:
    driver: local
  ollama-data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  jarvis-network:
    driver: bridge
