version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm start

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - ROUTER_URL=http://router:8080
      - KAFKA_BROKERS=kafka:9092
      - GROUP_ID=jarvis-main
    depends_on:
      - kafka
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Kafka (optional - if not running separately)
  # kafka:
  #   image: confluentinc/cp-kafka:7.4.0
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  # Zookeeper (optional - if not running separately)
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.4.0
  #   ports:
  #     - "2181:2181"
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181

networks:
  default:
    name: jarvis-network
