version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qwen-postgres
    environment:
      POSTGRES_USER: qwen
      POSTGRES_PASSWORD: qwen
      POSTGRES_DB: qwen_observation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwen -d qwen_observation"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
