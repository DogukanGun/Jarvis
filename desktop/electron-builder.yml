appId: com.jarvis.app
productName: Jarvis
copyright: Copyright © 2025 Jarvis

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

# Agent source files bundled read-only in resources.
# agentWorkDir() in agent-spawner.ts mirrors them to userData on first launch
# so pip install / npm install can write .venv / node_modules there.
extraResources:
  - from: '../agent/solana-trader'
    to: 'agent/solana-trader'
    filter:
      - '**/*'
      - '!node_modules/**'
      - '!dist/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: '../agent/solana-strategy'
    to: 'agent/solana-strategy'
    filter:
      - '**/*'
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!**/*.db'
  - from: '../agent/legal-rag'
    to: 'agent/legal-rag'
    filter:
      - '**/*'
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!**/*.db'
      - '!data/*.pkl'
      - '!data/*.index'
      - '!data/*.gpickle'

asarUnpack:
  - resources/**

mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Jarvis uses the camera for Guard Mode visual monitoring.
    - NSMicrophoneUsageDescription: Jarvis uses the microphone for voice commands.
    - NSDocumentsFolderUsageDescription: Jarvis may read documents for the Legal RAG agent.
    - NSDownloadsFolderUsageDescription: Jarvis may save files to your Downloads folder.
  notarize: false

dmg:
  artifactName: Jarvis-${version}.${ext}

win:
  icon: build/icon.png
  executableName: Jarvis

nsis:
  artifactName: Jarvis-${version}-setup.${ext}
  shortcutName: Jarvis
  uninstallDisplayName: Jarvis
  createDesktopShortcut: always

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: jarvis@example.com
  category: Utility

appImage:
  artifactName: Jarvis-${version}.${ext}

deb:
  artifactName: Jarvis-${version}.${ext}

npmRebuild: false
publish: null
